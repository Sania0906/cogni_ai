name: CognifyAI Selenium Web E2E Test Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  selenium-e2e-tests:
    name: Run Selenium E2E Tests on React WebApp
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Execute End-to-End Test Suite & Validations
        run: |
          cd automation
          node scripts/runTestSuite.js

      - name: 4. Upload E2E Test Artifacts (Excel & HTML Reports)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-e2e-reports
          path: |
            automation/excel/E2E_Report.xlsx
            automation/reports/
            automation/logs/
          retention-days: 30
