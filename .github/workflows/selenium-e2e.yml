name: CognifyAI Selenium Web E2E Test Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  selenium-e2e-tests:
    name: Run Selenium E2E Tests on React WebApp
    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser: [chrome]

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Install Automation Dependencies
        run: |
          cd automation
          npm install --no-audit --no-fund

      - name: 4. Execute Selenium E2E Test Suite & Validations
        env:
          BROWSER: ${{ matrix.browser }}
          HEADLESS: "true"
          BASE_URL: "http://localhost:5173"
        run: |
          cd automation
          npm test || true

      - name: 5. Generate Excel & HTML Execution Reports
        run: |
          cd automation
          npm run report:excel

      - name: 6. Upload Test Artifacts (Excel, HTML, Logs)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-e2e-reports-${{ matrix.browser }}
          path: |
            automation/excel/E2E_Report.xlsx
            automation/reports/
            automation/logs/
          retention-days: 30
