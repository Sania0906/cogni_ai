name: CognifyAI Selenium Web E2E Test Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  selenium-e2e-tests:
    name: Run Selenium E2E Tests on React WebApp
    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'automation/package.json'

      - name: 3. Install Root & Automation Dependencies
        run: |
          cd automation
          npm install

      - name: 4. Install Chrome & Firefox Browsers
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable firefox

      - name: 5. Start CognifyAI Backend & WebApp in Background
        run: |
          # Start Backend
          cd WebApp/backend
          npm install
          npm run build
          node dist/server.js &
          
          # Start WebApp
          cd ../../WebApp
          npm install
          npm run build
          npm run preview -- --port 5173 --host 0.0.0.0 &
          
          # Wait for WebApp readiness
          sleep 10
          curl -I http://localhost:5173 || true

      - name: 6. Execute Selenium E2E Test Suite
        env:
          BROWSER: ${{ matrix.browser }}
          HEADLESS: "true"
          BASE_URL: "http://localhost:5173"
        run: |
          cd automation
          npm test || true

      - name: 7. Generate Excel & HTML Reports
        run: |
          cd automation
          npm run report:excel

      - name: 8. Upload Test Artifacts (Excel, HTML, Logs)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-e2e-reports-${{ matrix.browser }}
          path: |
            automation/excel/E2E_Report.xlsx
            automation/reports/
            automation/logs/
          retention-days: 30
