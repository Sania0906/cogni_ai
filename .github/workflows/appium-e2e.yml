name: CognifyAI Appium Mobile E2E Test Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  appium-mobile-tests:
    name: Run Appium Android E2E Tests
    runs-on: macos-13 # macos runners support hardware acceleration for Android emulator

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'automation/package.json'

      - name: 3. Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK & Tools
        uses: android-actions/setup-android@v3

      - name: 5. Install Appium 2.x & UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: 6. Install Automation Dependencies
        run: |
          cd automation
          npm install

      - name: 7. Start Appium Server in Background
        run: |
          appium --log appium.log &
          sleep 5

      - name: 8. Run Android Emulator & Execute Appium Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          script: |
            cd automation
            npm run test:mobile || true

      - name: 9. Generate Mobile Excel & HTML Execution Reports
        run: |
          cd automation
          npm run report:excel

      - name: 10. Upload Mobile Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-mobile-reports
          path: |
            automation/excel/Mobile_E2E_Report.xlsx
            automation/reports/
            automation/logs/
          retention-days: 30
