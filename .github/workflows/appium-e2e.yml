name: CognifyAI Appium Mobile E2E Test Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  appium-mobile-tests:
    name: Run Appium Android E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Execute Mobile E2E Test Suite & Validations
        run: |
          cd automation
          node scripts/runTestSuite.js

      - name: 4. Upload Mobile E2E Artifacts (Excel & Logs)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-mobile-reports
          path: |
            automation/excel/Mobile_E2E_Report.xlsx
            automation/reports/
            automation/logs/
          retention-days: 30
